[project]
name = "cognitest-backend"
version = "0.1.0"
description = "Backend API for Cognitest - FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "prisma==0.15.0",
    "python-jose[cryptography]==3.5.0",

    "bcrypt==5.0.0",
    "python-dotenv==1.0.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",
    # Contract-testing engine dependencies (mounted into the main app under /api/v1/contract)
    "requests>=2.32.0",
    "jsonschema>=4.21.1",
    "openapi-spec-validator>=0.7.1",
    "prance>=0.22.11",
    "chardet<6",
    "pyyaml>=6.0.1",
    "ruamel-yaml>=0.18.6,<0.19",
    "pyyaml>=6.0.1",
    "ruamel-yaml>=0.18.6,<0.19",
    "packaging>=24.2,<25",
    "pydantic>=2.6.0",
    "nest-asyncio>=1.6.0",
    "arq>=0.26.1",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

# Optional dependencies for running the contract-testing engine under
# src/modules/generator.
contract_testing = [
    "requests>=2.32.0",
    "jsonschema>=4.21.1",
    "openapi-spec-validator>=0.7.1",
    "prance>=0.22.11",
    "chardet<6",
    "PyYAML>=6.0.1",
    "ruamel.yaml>=0.18.6,<0.19",
    "packaging>=24.2,<25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Ensure session-scoped async fixtures share the same loop as tests.
# This avoids "RuntimeError: Event loop is closed" when using Prisma/httpx on Windows.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
rootdir = "."

pythonpath = ["."]
# Show stdout/stderr (prints) while tests run (matches prior behavior).
addopts = "-s"
testpaths = [
    "src",
    "src/modules/test",
    "src/modules/generator/engines/contract/tests",
    "src/modules/generator/engines/negative",
    "src/modules/generator/ai/generators/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.prisma]
# Prisma configuration is in prisma/schema.prisma
